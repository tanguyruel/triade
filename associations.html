<!--STATIQUE:début--><noscript><h1>Les associations rencontrées</h1><ul><li><strong>Rewilding Apennines</strong> — Ours brun marsicain (Italie, Début mars) : Une association qui œuvre au retour d’une nature sauvage dans les Apennins centraux, où vit l’ours brun marsicain, l’un des ours les plus menacés d’Europe. <a href="https://rewilding-apennines.com">https://rewilding-apennines.com</a></li><li><strong>PPNEA</strong> — Lynx des Balkans (Albanie, Fin mars) : Protection and Preservation of Natural Environment in Albania : une association albanaise de protection de la nature, engagée notamment pour le lynx des Balkans, un des félins les plus rares d’Europe. <a href="https://ppnea.org">https://ppnea.org</a></li><li><strong>ARCTUROS &amp; Callisto</strong> — Ours brun et loup (Grèce, Début avril) : Deux associations grecques qui travaillent ensemble, et avec lesquelles nous travaillerons en même temps. ARCTUROS protège l’ours brun et le loup et accueille des ours secourus dans son refuge de Nymfaio. Callisto est une organisation environnementale grecque pour la faune sauvage et la nature. <a href="https://www.arcturos.gr">https://www.arcturos.gr</a></li><li><strong>EuroNatur</strong> — Ceinture verte européenne (Hongrie, Début mai) : Une fondation européenne de protection de la nature, qui travaille à faire de l’ancien rideau de fer, de la mer de Barents à la mer Noire, un corridor de nature : la Ceinture verte européenne. <a href="https://www.euronatur.org">https://www.euronatur.org</a></li><li><strong>NABU</strong> — Cigognes et oiseaux (Allemagne, Du 20 juin au 5 juillet environ) : Le NABU est la plus grande association allemande de protection de la nature. Son Michael-Otto-Institut, à Bergenhusen, étudie notamment les cigognes blanches. <a href="https://www.nabu.de">https://www.nabu.de</a></li></ul></noscript><!--STATIQUE:fin-->
